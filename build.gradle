plugins { id 'com.android.application' }
android {
    namespace 'com.mylang.ide'
    compileSdk 34
    defaultConfig { applicationId 'com.mylang.ide'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['META-INF/*'] } }
}
dependencies { implementation 'org.smali:dexlib2:2.5.2' }  // pure Java: emits DEX, no NDK/.so
